name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrapers:
    name: Scrapers (lint + unit tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: scrapers } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: scrapers/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

  integration:
    name: Integration (Postgres + scrapers + alerts)
    runs-on: ubuntu-latest
    needs: [scrapers, web]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: stagefinder, POSTGRES_PASSWORD: stagefinder, POSTGRES_DB: stagefinder }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://stagefinder:stagefinder@localhost:5432/stagefinder
      TEST_DATABASE_URL: postgresql://stagefinder:stagefinder@localhost:5432/stagefinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: scrapers/requirements-dev.txt }
      - run: npm ci && npx prisma migrate deploy
        working-directory: web
      - run: pip install -r requirements-dev.txt
        working-directory: scrapers
      - name: Seed with the demo source (Python writes the Prisma schema)
        run: python run.py --sources demo
        working-directory: scrapers
      - run: pytest -q tests/test_pipeline.py
        working-directory: scrapers
      - run: npx vitest run tests/db.integration.test.ts
        working-directory: web
      - run: npm run alerts -- --dry-run
        working-directory: web

  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: secret
        run: echo "present=${{ secrets.DATABASE_URL != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.present == 'true'
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - if: steps.secret.outputs.present == 'true'
        run: npm ci && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: steps.secret.outputs.present != 'true'
        run: echo "::notice::DATABASE_URL secret not set — skipping production migrations"
