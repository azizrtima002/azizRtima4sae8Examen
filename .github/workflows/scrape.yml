name: Scrape offers & send alerts

on:
  schedule:
    # 06:00 and 18:00 Tunis time (UTC+1)
    - cron: "0 5,17 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma separated sources (default: all real sources)"
        required: false
        default: "tanitjobs,keejob,emploi_nat"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the DATABASE_URL repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: scrapers/requirements.txt }
      - run: pip install -r requirements.txt
        working-directory: scrapers
      - name: Run scrapers (a failing source does not stop the others)
        run: python run.py --sources "${{ github.event.inputs.sources || 'tanitjobs,keejob,emploi_nat' }}"
        working-directory: scrapers

      - uses: actions/setup-node@v4
        if: (success() || failure()) && env.DATABASE_URL != ''
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Send email alerts
        if: (success() || failure()) && env.DATABASE_URL != ''
        working-directory: web
        run: npm ci && npm run alerts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
